<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nacionalidade</title>
</head>
<body>
    <h1>Sua Nacionalidade</h1>
    Nacionalidade:
    <input type="text" name="txtnac" id="txtnac">
    <input type="button" value="Verificar" onclick="clicar()"> 
    <div id="res"></div>

    <script>
        function clicar() {
            var txtn = window.document.querySelector('input#txtnac')
            var res = window.document.getElementById('res')
            var pais = txtn.value

            res.innerHTML = `<p>Vivendo em <strong>${pais}</strong></p>`
            
            if (pais == 'Brasil') {
                res.innerHTML += `<p>Você é <strong>BRASILEIRO</strong>!</p>`
            } else {
                res.innerHTML += `<p>Você é <strong>ESTRANGEIRO</strong>!</p>`
            }
        }
    </script>
</body>
</html>
