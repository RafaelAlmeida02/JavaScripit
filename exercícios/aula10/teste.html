<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        div#area {
            /*

            font: normal 20pt Arial;
            background: rgb(42, 139, 42);
            color: white;
            width: 200px;
            height: 200px;

            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body> <!--Primeira forma de manipulação de eventos pelo html e JS-->
    <div id="area" onclick="clicar()" onmouseenter="entrar()" onmouseout="sair()">
        Interaja...
    </div>
    <a href="ex006.html">Segunda forma de manipulação de eventos só pelo javascript (Veja no Vs code)</a>
    <script>
        // Eu posso colocar o comando de forma que funcione para todos.
        // Exemplo
        //var a = document.getElementById('area')
        //e tirar de dentro das funções, evitando repetir 3 vezes, mas isso não é recomendado, pois pode gerar erros.
        function clicar() {
            var a = document.getElementById('area')
            a.innerText = 'Clicou!'
        }
        function entrar() {
            var a = document.getElementById('area')
            a.innerText = 'Entrou!'
        }
        function sair() {
            var a = document.getElementById('area')
            a.innerText = 'Saiu!'
        }
    </script>
</body>
</html>
