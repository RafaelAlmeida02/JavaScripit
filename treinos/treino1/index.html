<body>
    <h1>teste</h1>

    <script>
        var idade = prompt('Qual a sua idade?');
        if (idade < 16) {
            console.log('Não vota');
        } else if (idade >= 16 && idade < 18 || idade > 65) {
            console.log('Voto opcional');
        } else {
            console.log('Voto obrigatório');
        }
    </script>
