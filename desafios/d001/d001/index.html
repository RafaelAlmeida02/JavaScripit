<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio das Mensagens</title>
    <style>
        button {
            width: 90px;
            height: 60px;
        }
    </style>
</head>
<body>
    <h1>Desafio das Mensagens</h1>
    <button id="botao" onclick="clicar()">Botão 1</button>
    <button id="botao2" onclick="clicar2()">Botão 2</button>
    <button id="botao3" onclick="clicar3()">Botão 3</button>

    <script>
        function clicar(){
            window.alert('Você clicou no 1 botão!')
        }
        function clicar2(){
            window.alert('Você clicou no 2 botão!')
        }
        function clicar3(){
            window.alert('Você clicou no 3 botão!')
        }
    </script>
</body>
</html>
